<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit study part</title>
  <script src="../../revisitUtilities/revisit-communicate.js"></script>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color:#17202a; background:#f4f6f8; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; }
    main { max-width:680px; margin:40px auto; background:#fff; border:1px solid #ccd3da; border-radius:8px; padding:24px; }
    h1 { margin:0 0 12px; font-size:24px; letter-spacing:0; }
    p { line-height:1.55; }
    .success { border-left:5px solid #18794e; padding-left:14px; }
    .error { border-left:5px solid #b42318; padding-left:14px; color:#8a1c13; }
    button { border:0; border-radius:6px; padding:10px 14px; color:#fff; background:#1f6feb; font:inherit; font-weight:650; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Submitting this study part</h1>
    <div id="status" aria-live="polite"><p>Please keep this page open while your SONA credit is granted.</p></div>
    <button id="retry" type="button" hidden>Try again</button>
  </main>
  <script>
  (function () {
    "use strict";
    var participantId = null;
    var partNumber = null;
    var status = document.getElementById("status");
    var retry = document.getElementById("retry");

    function submit() {
      retry.hidden = true;
      status.className = "";
      status.innerHTML = "<p>Please keep this page open while your SONA credit is granted.</p>";
      fetch("/api/sona/complete-part", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({participantId:participantId, partNumber:partNumber})
      }).then(function (response) {
        return response.json().then(function (body) {
          if (!response.ok) throw new Error(body.detail || "Credit granting failed");
          return body;
        });
      }).then(function (result) {
        status.className = "success";
        status.innerHTML = partNumber === 4
          ? "<p><strong>Study complete.</strong> Your final SONA credit has been granted. Select Finish below to close the study.</p>"
          : "<p><strong>Part " + partNumber + " complete.</strong> Your SONA credit has been granted. SONA will make Part " + (partNumber + 1) + " available after the configured 24-hour separation. Select Finish below to close this part.</p>";
        Revisit.postAnswers({sonaCreditGranted:true, sonaPart:partNumber, studyCompleted:result.studyCompleted});
      }).catch(function (error) {
        status.className = "error";
        status.innerHTML = "<p><strong>Credit could not be confirmed.</strong> " + error.message + ". Do not close the page; try again or contact the researcher.</p>";
        retry.hidden = false;
      });
    }

    retry.onclick = submit;
    Revisit.onDataReceive(function (data) {
      participantId = data.__revisit && data.__revisit.participantId;
      partNumber = Number(data.partNumber);
      if (!participantId || partNumber < 1 || partNumber > 4) {
        status.className = "error";
        status.innerHTML = "<p>This SONA link is incomplete. Please reopen the study from SONA.</p>";
        return;
      }
      submit();
    });
  }());
  </script>
</body>
</html>
