name: ai-withdrawal

services:
  study:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_STORAGE_ENGINE: ${VITE_STORAGE_ENGINE:-localStorage}
        VITE_REPO_URL: ${VITE_REPO_URL:-https://github.com/revisit-studies/study}
        VITE_FIREBASE_CONFIG: ${VITE_FIREBASE_CONFIG:-}
        VITE_RECAPTCHAV3TOKEN: ${VITE_RECAPTCHAV3TOKEN:-}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "0.0.0.0:${STUDY_HTTP_PORT:-8080}:80"
    depends_on:
      haic-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  haic-api:
    build:
      context: ./services/haic_api
    env_file:
      - ${STUDY_ENV_FILE:-.env.docker}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
